name: Android Check

# ── Trigger ───────────────────────────────────────────────────────────────────
# Lightweight validation only. Full APK builds are intentionally done in
# GitHub Codespaces (see docs/codespaces-android.md), not here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Limit token permissions to the minimum required (read-only checkout)
permissions:
  contents: read

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Android Gradle project + wrapper may not be committed yet. Detect the
      # wrapper up front so the lint steps below can be skipped gracefully instead
      # of failing every push/PR until the wrapper is added.
      - name: Check for Gradle wrapper
        id: gradlew
        run: |
          if [[ -f "./gradlew" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Gradle wrapper (./gradlew) not found — skipping lint until the Android Gradle project and wrapper are committed. Generate it with: gradle wrapper --gradle-version <version>"
          fi

      - name: Set up JDK 17
        if: steps.gradlew.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle wrapper validation — ensures gradlew is authentic
      - name: Validate Gradle wrapper
        if: steps.gradlew.outputs.present == 'true'
        uses: gradle/actions/wrapper-validation@v4

      # Cache Gradle downloads to speed up subsequent runs
      - name: Cache Gradle packages
        if: steps.gradlew.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        if: steps.gradlew.outputs.present == 'true'
        run: chmod +x ./gradlew

      # Run Android lint (fast, no emulator needed)
      - name: Run lint
        if: steps.gradlew.outputs.present == 'true'
        run: ./gradlew lint --no-daemon

      # NOTE: Full APK assembly (assembleDebug / assembleRelease) is intentionally
      # NOT included here. Run those inside a Codespace using:
      #   make apk-debug
      #   make apk-release

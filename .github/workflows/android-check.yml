name: Android Check

# ── Trigger ───────────────────────────────────────────────────────────────────
# Lightweight validation only. Full APK builds are intentionally done in
# GitHub Codespaces (see docs/codespaces-android.md), not here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Limit token permissions to the minimum required (read-only checkout)
permissions:
  contents: read

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle wrapper validation — ensures gradlew is authentic
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      # Cache Gradle downloads to speed up subsequent runs
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle wrapper executable
        run: |
          if [[ ! -f "./gradlew" ]]; then
            echo "::error::Gradle wrapper (./gradlew) not found. Generate and commit it with: gradle wrapper --gradle-version <version>"
            exit 1
          fi
          chmod +x ./gradlew

      # Run Android lint (fast, no emulator needed)
      - name: Run lint
        run: ./gradlew lint --no-daemon

      # NOTE: Full APK assembly (assembleDebug / assembleRelease) is intentionally
      # NOT included here. Run those inside a Codespace using:
      #   make apk-debug
      #   make apk-release
